<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本差异对比器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fafafa; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 16px; color: #333; }
        .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 24px; margin-bottom: 16px; }
        .btn { padding: 8px 20px; border-radius: 4px; cursor: pointer; border: none; font-size: 14px; }
        .btn-blue { background: #007bff; color: #fff; }
        .btn-green { background: #28a745; color: #fff; }
        .btn-gray { background: #6c757d; color: #fff; }
        .row { display: flex; gap: 16px; }
        .col { flex: 1; }
        .col label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; }
        textarea { width: 100%; min-height: 300px; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-family: monospace; font-size: 13px; resize: vertical; }
        .result-area { min-height: 300px; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-family: monospace; font-size: 13px; white-space: pre-wrap; background: #fff; overflow: auto; }
        .diff-added { background: #d4edda; color: #155724; }
        .diff-removed { background: #f8d7da; color: #721c24; }
        .diff-unchanged { color: #333; }
        .stats { margin-top: 12px; font-size: 13px; color: #666; }
        .legend { display: flex; gap: 16px; margin-bottom: 12px; }
        .legend span { display: flex; align-items: center; gap: 6px; }
        .legend-dot { width: 16px; height: 16px; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>文本差异对比器</h1>
        <div class="card">
            <div class="legend">
                <span><span class="legend-dot" style="background:#d4edda;"></span>新增</span>
                <span><span class="legend-dot" style="background:#f8d7da;"></span>删除</span>
                <span><span class="legend-dot" style="background:#fff; border:1px solid #ddd;"></span>未变</span>
            </div>
            <div class="row">
                <div class="col">
                    <label>原文</label>
                    <textarea id="original" placeholder="输入原始文本..."></textarea>
                </div>
                <div class="col">
                    <label>修改后</label>
                    <textarea id="modified" placeholder="输入修改后的文本..."></textarea>
                </div>
            </div>
            <div style="margin-top: 16px;">
                <button class="btn btn-blue" onclick="compare()">对比差异</button>
                <button class="btn btn-gray" onclick="clearAll()">清空</button>
            </div>
        </div>
        <div class="card">
            <label>差异结果</label>
            <div class="result-area" id="result"></div>
            <div class="stats" id="stats"></div>
        </div>
    </div>
    <script>
        function clearAll() {
            document.getElementById('original').value = '';
            document.getElementById('modified').value = '';
            document.getElementById('result').innerHTML = '';
            document.getElementById('stats').innerHTML = '';
        }
        
        function compare() {
            const original = document.getElementById('original').value;
            const modified = document.getElementById('modified').value;
            const result = document.getElementById('result');
            const stats = document.getElementById('stats');
            
            if (!original && !modified) {
                result.innerHTML = '<span style="color:#666;">请输入文本进行对比</span>';
                return;
            }
            
            const origLines = original.split('\n');
            const modLines = modified.split('\n');
            
            // Simple line-by-line diff
            let added = 0, removed = 0, unchanged = 0;
            let html = '';
            
            const maxLines = Math.max(origLines.length, modLines.length);
            
            for (let i = 0; i < maxLines; i++) {
                const origLine = origLines[i] !== undefined ? origLines[i] : null;
                const modLine = modLines[i] !== undefined ? modLines[i] : null;
                
                if (origLine === modLine) {
                    if (origLine !== null) {
                        html += `<span class="diff-unchanged">  ${escapeHtml(origLine)}</span>\n`;
                        unchanged++;
                    }
                } else {
                    if (origLine !== null && origLine !== '') {
                        html += `<span class="diff-removed">- ${escapeHtml(origLine)}</span>\n`;
                        removed++;
                    }
                    if (modLine !== null && modLine !== '') {
                        html += `<span class="diff-added">+ ${escapeHtml(modLine)}</span>\n`;
                        added++;
                    }
                }
            }
            
            result.innerHTML = html || '<span style="color:#666;">两段文本完全相同</span>';
            stats.textContent = `新增: ${added} 行 | 删除: ${removed} 行 | 未变: ${unchanged} 行`;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
